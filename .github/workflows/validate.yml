name: Repository validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - name: Install Python analysis dependencies
        run: python -m pip install -r config/functional_requirements.txt
      - name: Install R statistical test dependency
        run: Rscript -e 'install.packages("vegan", repos = "https://cloud.r-project.org")'
      - name: Validate source, statistical contracts, portability and checksums
        run: make validate
